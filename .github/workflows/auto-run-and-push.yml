name: 自动运行咪咕节目采集(游客模式)
on:
  schedule:
    #  北京时间 00:00 / 06:00 /12:00 /18:00
    - cron: '0 16,22,4,10 * * *'
  workflow_dispatch:

jobs:
  run-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ''

      - name: Run migu.js 游客模式
        run: |
          export TZ='Asia/Shanghai'
          node migu.js
        timeout-minutes: 8
        env:
          # 游客模式：账号留空，不填muserId/mtoken
          muserId: ""
          mtoken: ""
          mhost: "local-static"
          mrateType: "3"   #3=高清，游客最高只能高清；4蓝光需要VIP账号
          mpass: ""
          mdebug: "false"

      - name: 校验生成文件
        id: check_files
        run: |
          echo "===== 文件列表 $(TZ='Asia/Shanghai' date) ====="
          ls -la
          INTERFACE_TXT=$(find . -name "interface.txt" | head -n1)
          INTERFACE_TXT2=$(find . -name "interfaceTXT.txt" | head -n1)
          PLAYBACK_XML=$(find . -name "playback.xml" | head -n1)

          echo "INTERFACE_TXT=$INTERFACE_TXT" >> $GITHUB_ENV
          echo "INTERFACE_TXT2=$INTERFACE_TXT2" >> $GITHUB_ENV
          echo "PLAYBACK_XML=$PLAYBACK_XML" >> $GITHUB_ENV

          if [[ -z "$INTERFACE_TXT" || -z "$INTERFACE_TXT2" || -z "$PLAYBACK_XML" ]];then
            echo "ERROR:缺少输出文件！"
            exit 1
          fi

      - name: Commit & Push 更新文件
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

          git add $INTERFACE_TXT $INTERFACE_TXT2 $PLAYBACK_XML
          if git diff --cached --quiet;then
            echo "文件无变化，跳过提交"
            exit 0
          fi
          COMMIT_TIME=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')
          git commit -m "Auto update(guest): $COMMIT_TIME UTC+8"
          git push origin HEAD:main --force-with-lease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
